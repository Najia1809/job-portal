{% extends "base.html" %}
{% block title %}Admin Panel{% endblock %}
{% block content %}
<h3 class="mb-1">Admin Panel</h3>
<p class="text-muted">All {{ tables|length }} tables of the database. Click a table to add, edit or delete records.</p>
<div class="row g-3">
  {% for name, count in tables %}
    <div class="col-6 col-md-3">
      <a class="text-decoration-none" href="{{ url_for('admin.list_rows', table=name) }}">
        <div class="card h-100 shadow-sm">
          <div class="card-body py-3">
            <div class="fw-semibold">{{ name }}</div>
            <div class="text-muted small">{{ count }} record(s)</div>
          </div>
        </div>
      </a>
    </div>
  {% endfor %}
</div>
{% endblock %}
